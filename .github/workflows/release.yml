name: Release ESO Addon ZIP

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version from tag
        id: release_metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with v, for example v1.1.1"
          }

          $version = $tag.Substring(1)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=NextTryStatusTracker_$version.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Tag: $tag"
          Write-Host "Version: $version"

      - name: Validate manifest metadata
        shell: pwsh
        run: |
          $manifestPath = "NextTryStatusTracker/NextTryStatusTracker.txt"
          $version = "${{ steps.release_metadata.outputs.version }}"

          if (-not (Test-Path $manifestPath)) {
            throw "Manifest not found: $manifestPath"
          }

          if ($version -notmatch "^(\d+)\.(\d+)\.(\d+)$") {
            throw "Tag version '$version' must use numeric major.minor.patch format."
          }

          $expectedAddonVersion =
            ([int]$Matches[1] * 10000) +
            ([int]$Matches[2] * 100) +
            [int]$Matches[3]

          $manifest = Get-Content $manifestPath -Encoding UTF8
          $requiredLines = @(
            "## Title: NextTry StatusTracker",
            "## Author: R0ctan",
            "## Credits: AI-assisted development by Auralith / ChatGPT",
            "## Version: $version",
            "## AddOnVersion: $expectedAddonVersion",
            "## APIVersion: 101049 101050",
            "## SavedVariables: NextTryStatusTrackerSavedVariables",
            "## DependsOn: LibAddonMenu-2.0>=43"
          )

          foreach ($line in $requiredLines) {
            if ($manifest -notcontains $line) {
              throw "Manifest is missing required value: $line"
            }
          }

          Write-Host "Manifest metadata matches release rules for version $version (AddOnVersion $expectedAddonVersion)."

      - name: Validate package structure
        shell: pwsh
        run: |
          $addonRoot = "NextTryStatusTracker"
          $manifestPath = "$addonRoot/NextTryStatusTracker.txt"

          if (-not (Test-Path $addonRoot)) {
            throw "Addon folder missing: $addonRoot"
          }

          if (-not (Test-Path $manifestPath)) {
            throw "Manifest missing: $manifestPath"
          }

          $forbidden = @(
            "$addonRoot/.git",
            "$addonRoot/.github",
            "$addonRoot/.vscode",
            "$addonRoot/tools",
            "$addonRoot/docs",
            "$addonRoot/release",
            "$addonRoot/SavedVariables",
            "$addonRoot/__MACOSX"
          )

          foreach ($path in $forbidden) {
            if (Test-Path $path) {
              throw "Forbidden path inside addon folder: $path"
            }
          }

          $forbiddenFilePatterns = @(
            "desktop.ini",
            "Thumbs.db",
            ".DS_Store",
            "*.bak",
            "*.tmp",
            "*.log"
          )

          foreach ($file in Get-ChildItem -Path $addonRoot -Recurse -Force -File) {
            foreach ($pattern in $forbiddenFilePatterns) {
              if ($file.Name -like $pattern) {
                throw "Forbidden file inside addon folder: $($file.FullName)"
              }
            }
          }

          $manifest = Get-Content $manifestPath -Encoding UTF8
          $referencedFiles = $manifest |
            Where-Object {
              $_ -and
              -not $_.StartsWith("##") -and
              -not $_.StartsWith("#") -and
              $_.Trim().Length -gt 0
            }

          foreach ($file in $referencedFiles) {
            if ($file -eq 'lang/$(language).lua') {
              continue
            }

            $path = Join-Path $addonRoot ($file -replace "/", "\")
            if (-not (Test-Path $path)) {
              throw "Manifest references missing file: $file"
            }
          }

          if ($manifest -contains 'lang/$(language).lua') {
            if (-not (Test-Path "$addonRoot/lang/default.lua")) {
              throw "Manifest uses lang/`$(language).lua but lang/default.lua is missing."
            }
          }

          Write-Host "Package structure validation passed."

      - name: Build ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null

          $zipPath = "release/${{ steps.release_metadata.outputs.zip_name }}"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "NextTryStatusTracker" -DestinationPath $zipPath -Force

          if (-not (Test-Path $zipPath)) {
            throw "ZIP was not created: $zipPath"
          }

          Write-Host "Created ZIP: $zipPath"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NextTry StatusTracker ${{ steps.release_metadata.outputs.version }}
          files: release/${{ steps.release_metadata.outputs.zip_name }}
          body_path: docs/release-notes/GITHUB_RELEASE_${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
